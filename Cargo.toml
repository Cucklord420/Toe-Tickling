[package]
name = "toe-tickling"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"
description = "Living rule book rendering and evidence receipt validation"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "parsing"] }
tempfile = "3"
regex = "1"
serde_yaml_ng = "0.10"

[workspace]
members = ["rust/audit"]
resolver = "3"

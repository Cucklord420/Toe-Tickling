name: Rule book audit
on:
  push:
  pull_request:
  schedule:
    - cron: '23 12 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: guidebook-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, inherited inspected pin
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup show
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - name: Regression tests
        run: cargo test --workspace --locked
      - name: Structural policy and freshness audit
        run: cargo run --locked -- check
      - name: Render check
        run: cargo run --locked -- render --check
      - name: Independent Rust source-byte audit
        run: cargo run --locked -p guidebook-audit -- check .

  validate-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, inherited inspected pin
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup show
      - name: Windows drive-root inspection regression test
        run: cargo test --locked -p toe-tickling --lib security::tests::checked_root_accepts_native_drive_prefix
      - name: Non-Git public-tree native-path regression test
        run: cargo test --locked -p toe-tickling --lib security::tests::non_git_file_list_accepts_native_nested_paths
      - name: Transaction regression tests
        run: cargo test --locked -p toe-tickling --lib guide::build_transaction_tests
      - name: Adoption recovery regression tests
        run: cargo test --locked -p toe-tickling --lib adopt::tests::recovery_
      - name: Adoption promotion race regression test
        run: cargo test --locked -p toe-tickling --lib adopt::tests::apply_preserves
      - name: Adoption rollback failure test
        run: cargo test --locked -p toe-tickling --lib adopt::tests::apply_rolls_back
      - name: Adoption recovery CLI tests
        run: cargo test --locked -p toe-tickling --bin toe-tickling adopt_recover_

  validate-python-rust-parity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, inherited inspected pin
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, pinned
        id: setup-python
        with:
          python-version: '3.15.2'
          check-latest: false
      - name: Install the pinned Rust toolchain
        run: rustup show
      - name: Historical Python and current Rust differential regressions
        env:
          TOE_PYTHON_REFERENCE: ${{ steps.setup-python.outputs.python-path }}
        run: cargo test --locked -p toe-tickling --test python_rust_parity -- --ignored --nocapture
